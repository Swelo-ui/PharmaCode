name: Build & Release PharmaCode Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'pharmacode_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        working-directory: pharmacode_app
        run: flutter doctor -v

      - name: Get Flutter Dependencies
        working-directory: pharmacode_app
        run: flutter pub get

      - name: Run Code Analysis & Unit Tests
        working-directory: pharmacode_app
        run: |
          flutter analyze
          flutter test test/ai_pipeline_test.dart

      - name: Build Android Release APK (Universal & Split ABIs)
        working-directory: pharmacode_app
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Release-Universal-APK
          path: pharmacode_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Split ABIs (ARM64 & ARMv7)
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Split-APKs
          path: pharmacode_app/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: warn
