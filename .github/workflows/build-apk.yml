name: Build & Release PharmaCode Android APK & AAB

on:
  push:
    branches: [ main, master ]
    paths:
      - 'pharmacode_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK 37 & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=3 "platforms;android-37.0" "platforms;android-37" || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" "platforms;android-37" || true
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            cp -r "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          ls -la "$ANDROID_HOME/platforms"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        working-directory: pharmacode_app
        run: flutter doctor -v

      - name: Get Flutter Dependencies
        working-directory: pharmacode_app
        run: flutter pub get

      - name: Run Code Analysis & Unit Tests
        working-directory: pharmacode_app
        run: |
          flutter analyze
          flutter test test/ai_pipeline_test.dart

      - name: Build Android Release APK (Universal & Split ABIs)
        working-directory: pharmacode_app
        run: |
          set -e
          echo "Building Universal Release APK..."
          flutter build apk --release -v 2>&1 | tee ../flutter_apk_build.log || {
            echo "::error::Flutter build APK failed"
            tail -n 150 ../flutter_apk_build.log
            exit 1
          }
          echo "Building Split per ABI APKs..."
          flutter build apk --release --split-per-abi

      - name: Build Android App Bundle (AAB for Google Play Console)
        working-directory: pharmacode_app
        run: |
          echo "Building Signed Release AAB..."
          flutter build appbundle --release -v 2>&1 | tee ../flutter_aab_build.log || {
            echo "::error::Flutter build AAB failed"
            tail -n 150 ../flutter_aab_build.log
            exit 1
          }

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-assets
          cp pharmacode_app/build/app/outputs/flutter-apk/app-release.apk release-assets/PharmaCode-v1.0.2-Universal.apk
          cp pharmacode_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/PharmaCode-v1.0.2-arm64.apk 2>/dev/null || true
          cp pharmacode_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-assets/PharmaCode-v1.0.2-armv7.apk 2>/dev/null || true
          cp pharmacode_app/build/app/outputs/bundle/release/app-release.aab release-assets/PharmaCode-v1.0.2-Release.aab 2>/dev/null || true
          ls -la release-assets/

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Release-Universal-APK
          path: release-assets/PharmaCode-v1.0.2-Universal.apk
          if-no-files-found: error

      - name: Upload Split APKs (ARM64 & ARMv7)
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Split-APKs
          path: release-assets/PharmaCode-v1.0.2-arm*.apk
          if-no-files-found: warn

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Release-AAB
          path: release-assets/PharmaCode-v1.0.2-Release.aab
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.2
          name: "PharmaCode v1.0.2 Production Release"
          body: |
            ## PharmaCode v1.0.2 Release
            Official signed release artifacts for **PharmaCode — B.Pharm NEP 2020 Companion with PharmaHelper AI Tutor**.

            ### Available Downloads:
            - **Google Play App Bundle**: `PharmaCode-v1.0.2-Release.aab` (Signed with production release keystore for Play Console)
            - **Universal APK**: `PharmaCode-v1.0.2-Universal.apk` (Install directly on any Android device)
            - **ARM64 APK**: `PharmaCode-v1.0.2-arm64.apk` (Fast & lightweight for modern 64-bit phones)
          files: |
            release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
