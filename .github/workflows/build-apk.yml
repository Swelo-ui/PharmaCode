name: Build & Release PharmaCode Android APK & AAB

on:
  push:
    branches: [ main, master ]
    paths:
      - 'pharmacode_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK 37 Platform & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "Downloading official Android 37 Platform directly from Google..."
          curl -sL "https://dl.google.com/android/repository/platform-37.0_r02.zip" -o /tmp/platform-37.zip
          mkdir -p /tmp/p37 && unzip -q /tmp/platform-37.zip -d /tmp/p37
          mkdir -p "$ANDROID_HOME/platforms/android-37" "$ANDROID_HOME/platforms/android-37.0"
          cp -r /tmp/p37/*/* "$ANDROID_HOME/platforms/android-37/"
          cp -r /tmp/p37/*/* "$ANDROID_HOME/platforms/android-37.0/"
          echo "Installed platforms:"
          ls -la "$ANDROID_HOME/platforms"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        working-directory: pharmacode_app
        run: flutter doctor -v

      - name: Get Flutter Dependencies
        working-directory: pharmacode_app
        run: flutter pub get

      - name: Run Code Analysis & Unit Tests
        working-directory: pharmacode_app
        run: |
          flutter analyze
          flutter test test/ai_pipeline_test.dart

      - name: Build Android Release APK (Universal & Split ABIs)
        working-directory: pharmacode_app
        run: |
          set +e
          echo "Building Universal Release APK..."
          flutter build apk --release -v > build_output.log 2>&1
          BUILD_CODE=$?
          if [ $BUILD_CODE -ne 0 ]; then
            echo "### Flutter Build Failed (Exit Code: $BUILD_CODE)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "FAILURE|ERROR|Exception|What went wrong|Did not find|failed" -B 2 -A 8 build_output.log | tail -n 60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Last 60 lines of log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build_output.log
            exit $BUILD_CODE
          fi
          echo "Building Split per ABI APKs..."
          flutter build apk --release --split-per-abi

      - name: Build Android App Bundle (AAB for Google Play Console)
        working-directory: pharmacode_app
        run: |
          echo "Building Signed Release AAB..."
          flutter build appbundle --release -v

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-assets
          cp pharmacode_app/build/app/outputs/flutter-apk/app-release.apk release-assets/PharmaCode-v1.0.2-Universal.apk 2>/dev/null || true
          cp pharmacode_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/PharmaCode-v1.0.2-arm64.apk 2>/dev/null || true
          cp pharmacode_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-assets/PharmaCode-v1.0.2-armv7.apk 2>/dev/null || true
          cp pharmacode_app/build/app/outputs/bundle/release/app-release.aab release-assets/PharmaCode-v1.0.2-Release.aab 2>/dev/null || true
          ls -la release-assets/

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Release-Universal-APK
          path: release-assets/PharmaCode-v1.0.2-Universal.apk
          if-no-files-found: error

      - name: Upload Split APKs (ARM64 & ARMv7)
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Split-APKs
          path: release-assets/PharmaCode-v1.0.2-arm*.apk
          if-no-files-found: warn

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Release-AAB
          path: release-assets/PharmaCode-v1.0.2-Release.aab
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.2
          name: "PharmaCode v1.0.2 Production Release"
          body: |
            ## PharmaCode v1.0.2 Release
            Official signed release artifacts for **PharmaCode — B.Pharm NEP 2020 Companion with PharmaHelper AI Tutor**.

            ### Available Downloads:
            - **Google Play App Bundle**: `PharmaCode-v1.0.2-Release.aab` (Signed with production release keystore for Play Console)
            - **Universal APK**: `PharmaCode-v1.0.2-Universal.apk` (Install directly on any Android device)
            - **ARM64 APK**: `PharmaCode-v1.0.2-arm64.apk` (Fast & lightweight for modern 64-bit phones)
          files: |
            release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
