name: Build & Release PharmaCode Android APK & AAB

on:
  push:
    branches: [ main, master ]
    paths:
      - 'pharmacode_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK 37 Platform & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "Downloading official Android 37 Platform directly from Google..."
          curl -sL "https://dl.google.com/android/repository/platform-37.0_r02.zip" -o /tmp/platform-37.zip
          mkdir -p /tmp/p37 && unzip -q /tmp/platform-37.zip -d /tmp/p37
          mkdir -p "$ANDROID_HOME/platforms/android-37" "$ANDROID_HOME/platforms/android-37.0"
          cp -r /tmp/p37/*/* "$ANDROID_HOME/platforms/android-37/"
          cp -r /tmp/p37/*/* "$ANDROID_HOME/platforms/android-37.0/"
          echo "Installed platforms:"
          ls -la "$ANDROID_HOME/platforms"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        working-directory: pharmacode_app
        run: flutter doctor -v

      - name: Get Flutter Dependencies
        working-directory: pharmacode_app
        run: flutter pub get

      - name: Run Code Analysis & Unit Tests
        working-directory: pharmacode_app
        run: |
          flutter analyze
          flutter test test/ai_pipeline_test.dart

      - name: Compile Flutter Assets & Bundle
        working-directory: pharmacode_app
        run: flutter build bundle --release

      - name: Generate Android local.properties
        working-directory: pharmacode_app/android
        run: |
          FLUTTER_DIR=$(which flutter | sed 's|/bin/flutter||')
          VERSION_LINE=$(grep '^version:' ../pubspec.yaml | head -n 1 | awk '{print $2}')
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d '+' -f 1)
          VERSION_CODE=$(echo "$VERSION_LINE" | cut -d '+' -f 2)
          echo "Extracted Version: $VERSION_NAME+$VERSION_CODE"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "flutter.sdk=$FLUTTER_DIR" >> local.properties
          echo "flutter.buildMode=release" >> local.properties
          echo "flutter.versionName=$VERSION_NAME" >> local.properties
          echo "flutter.versionCode=$VERSION_CODE" >> local.properties
          cat local.properties

      - name: Build Android Release APK & AAB via Gradle
        working-directory: pharmacode_app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee gradle_build.log

      - name: Output Error to Summary
        if: failure()
        run: |
          echo "## Gradle Failure Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 pharmacode_app/android/gradle_build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Logs
          path: pharmacode_app/android/gradle_build.log
          if-no-files-found: ignore

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-assets
          find pharmacode_app/build/app/outputs -name "*.apk" -o -name "*.aab"
          cp pharmacode_app/build/app/outputs/apk/release/app-release.apk release-assets/PharmaCode-Universal.apk 2>/dev/null || cp pharmacode_app/build/app/outputs/flutter-apk/app-release.apk release-assets/PharmaCode-Universal.apk 2>/dev/null || true
          cp pharmacode_app/build/app/outputs/bundle/release/app-release.aab release-assets/PharmaCode-Release.aab 2>/dev/null || true
          ls -la release-assets/

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Release-Universal-APK
          path: release-assets/PharmaCode-Universal.apk
          if-no-files-found: error

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Release-AAB
          path: release-assets/PharmaCode-Release.aab
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.5
          name: "PharmaCode v1.0.5 (Build 6) Production Release"
          body: |
            ## PharmaCode v1.0.5 Release (Build 6)
            Official signed release artifacts for **PharmaCode — B.Pharm NEP 2020 Companion with PharmaHelper AI Tutor**.

            ### What's New in v1.0.5:
            - **Web Citations Fix**: Extracted real page titles and clean URLs instead of duplicate search queries.
            - **Output Formatting**: Fixed `<br>` tags in explanations and tables into clean native line breaks.
            - **AI Persona Hardening**: Strict PharmaCode AI Tutor identity preservation across queries and jailbreak prompts.
            - **AI Tutor Ads**: Integrated non-intrusive AdMob banner and frequency-capped interstitial ads.
            - **Navigation Polish**: Removed duplicate AI item from Drawer; redesigned Center AI Tutor button with sleek, modern UI/UX.

            ### Available Downloads:
            - **Google Play App Bundle**: `PharmaCode-Release.aab` (Signed with production release keystore for Play Console)
            - **Universal APK**: `PharmaCode-Universal.apk` (Install directly on any Android device)
          files: |
            release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
