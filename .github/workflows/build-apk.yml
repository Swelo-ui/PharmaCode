name: Build & Release PharmaCode Android APK & AAB

on:
  push:
    branches: [ main, master ]
    paths:
      - 'pharmacode_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Platform & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          # Ensure platform 37 availability (alias from android-36 in case any plugin requests SDK 37)
          echo "Ensuring platform 37 availability..."
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ] || [ ! -f "$ANDROID_HOME/platforms/android-37/android.jar" ]; then
            mkdir -p "$ANDROID_HOME/platforms/android-37"
            cp -r "$ANDROID_HOME/platforms/android-36"/* "$ANDROID_HOME/platforms/android-37/"
            if [ -f "$ANDROID_HOME/platforms/android-37/package.xml" ]; then
              sed -i 's/platforms;android-36/platforms;android-37/g' "$ANDROID_HOME/platforms/android-37/package.xml"
              sed -i 's/<api-level>36<\/api-level>/<api-level>37<\/api-level>/g' "$ANDROID_HOME/platforms/android-37/package.xml"
              sed -i 's/Platform 36/Platform 37/g' "$ANDROID_HOME/platforms/android-37/package.xml"
            fi
            if [ -f "$ANDROID_HOME/platforms/android-37/source.properties" ]; then
              sed -i 's/ro.build.version.sdk=36/ro.build.version.sdk=37/g' "$ANDROID_HOME/platforms/android-37/source.properties"
              sed -i 's/ro.build.version.codename=36/ro.build.version.codename=37/g' "$ANDROID_HOME/platforms/android-37/source.properties"
              sed -i 's/ro.build.version.release=36/ro.build.version.release=37/g' "$ANDROID_HOME/platforms/android-37/source.properties"
              sed -i 's/AndroidVersion.ApiLevel=36/AndroidVersion.ApiLevel=37/g' "$ANDROID_HOME/platforms/android-37/source.properties"
              sed -i 's/Platform 36/Platform 37/g' "$ANDROID_HOME/platforms/android-37/source.properties"
            fi
          fi
          echo "Installed Android SDK Platforms:"
          ls -la "$ANDROID_HOME/platforms"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        working-directory: pharmacode_app
        run: flutter doctor -v

      - name: Get Flutter Dependencies
        working-directory: pharmacode_app
        run: flutter pub get

      - name: Run Code Analysis & Unit Tests
        working-directory: pharmacode_app
        run: |
          flutter analyze --no-fatal-infos
          flutter test test/ai_pipeline_test.dart

      - name: Configure Production Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p pharmacode_app/android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > pharmacode_app/android/upload-keystore.jks
          else
            echo "" | base64 -d > pharmacode_app/android/upload-keystore.jks
          fi

          STORE_PWD="${STORE_PASSWORD:-pharmacode2026}"
          KEY_PWD="${KEY_PASSWORD:-pharmacode2026}"
          KEY_AL="${KEY_ALIAS:-pharmacode}"

          cat <<EOF > pharmacode_app/android/key.properties
          storePassword=$STORE_PWD
          keyPassword=$KEY_PWD
          keyAlias=$KEY_AL
          storeFile=../upload-keystore.jks
          EOF

      - name: Build Android Release APK
        working-directory: pharmacode_app
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation

      - name: Build Android Release AAB (Play Store)
        working-directory: pharmacode_app
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation

      - name: Output Error to Summary
        if: failure()
        run: |
          echo "## Build Failure" >> $GITHUB_STEP_SUMMARY
          echo "Flutter build failed. Check the detailed step logs above." >> $GITHUB_STEP_SUMMARY

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-assets
          find pharmacode_app/build/app/outputs -name "*.apk" -o -name "*.aab" -o -name "mapping.txt"
          find pharmacode_app/build/app/outputs -name "app-release.apk" -exec cp {} release-assets/PharmaCode-Universal.apk \; 2>/dev/null || true
          find pharmacode_app/build/app/outputs -name "app-release.aab" -exec cp {} release-assets/PharmaCode-Release.aab \; 2>/dev/null || true
          find pharmacode_app/build/app/outputs -name "mapping.txt" -exec cp {} release-assets/mapping.txt \; 2>/dev/null || true
          ls -la release-assets/

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Release-Universal-APK
          path: release-assets/PharmaCode-Universal.apk
          if-no-files-found: error

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Release-AAB
          path: release-assets/PharmaCode-Release.aab
          if-no-files-found: error

      - name: Upload Deobfuscation Mapping File
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-mapping-txt
          path: release-assets/mapping.txt
          if-no-files-found: ignore

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.14
          name: "PharmaCode v1.0.14 (Build 15) Production Release"
          body: |
            ## PharmaCode v1.0.14 Release (Build 15)
            Official production signed release artifacts for **PharmaCode — B.Pharm NEP 2020 Companion with PharmaHelper AI Tutor**.

            ### Security & Hardening:
            - **Signing Credentials Protection**: Keystore and `key.properties` removed from version control with `.gitignore` coverage; automated secure injection in CI/CD.
            - **Secure Storage Migration**: AI custom API keys migrated from plain `SharedPreferences` to hardware-backed `FlutterSecureStorage`.
            - **Android App Hardening**: Disabled Android cloud backups (`android:allowBackup="false"`).
            - **Web Security Headers**: Hardened Next.js with `X-Frame-Options: SAMEORIGIN`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: strict-origin-cross-origin`, and `Permissions-Policy`.

            ### Bugs & Functional Fixes:
            - **Push Notifications**: Fixed duplicate background FCM notifications by checking data-only payloads.
            - **Bookmark Sync**: Converted `SubjectDetailScreen` to reactive Riverpod `ConsumerStatefulWidget` for seamless real-time synchronization between syllabus and bookmark screens.
            - **Auth Null Safety**: Sanitized Firebase user session extraction and entity unwrapping.
            - **Website Links**: Fixed dead notes download button linking directly to syllabus units.
            - **Sitemap**: Dynamic route derivation for all 77+ subjects from syllabus data.

            ### UI/UX Improvements:
            - **Ad Friction Removed**: Removed unexpected interstitial ad interruption on chat message send.
            - **Sensitive Data Masking**: Added visibility toggles with masked passwords on AI API key inputs.
            - **Layout Overflow Protection**: Redesigned semester card metrics and responsive ratios to avoid text clipping across scaled display fonts.
            - **Lifecycle Resilient Timers**: Replaced recursive `Future.delayed` ticker with cancelable `Timer.periodic`.

            ### Play Store Optimizations:
            - Target SDK 36 (Android 16), Compile SDK 37 (Android 17).
            - R8 bytecode minification, dead-code elimination, and resource shrinking enabled.
            - Obfuscated release builds with mapping.txt symbols generated.
          files: |
            release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
