name: Build & Release PharmaCode Android APK & AAB

on:
  push:
    branches: [ main, master ]
    paths:
      - 'pharmacode_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Platform & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          # Ensure platform 37 availability (alias from android-36 in case any plugin requests SDK 37)
          echo "Ensuring platform 37 availability..."
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ] || [ ! -f "$ANDROID_HOME/platforms/android-37/android.jar" ]; then
            mkdir -p "$ANDROID_HOME/platforms/android-37"
            cp -r "$ANDROID_HOME/platforms/android-36"/* "$ANDROID_HOME/platforms/android-37/"
            if [ -f "$ANDROID_HOME/platforms/android-37/package.xml" ]; then
              sed -i 's/platforms;android-36/platforms;android-37/g' "$ANDROID_HOME/platforms/android-37/package.xml"
              sed -i 's/<api-level>36<\/api-level>/<api-level>37<\/api-level>/g' "$ANDROID_HOME/platforms/android-37/package.xml"
              sed -i 's/Platform 36/Platform 37/g' "$ANDROID_HOME/platforms/android-37/package.xml"
            fi
            if [ -f "$ANDROID_HOME/platforms/android-37/source.properties" ]; then
              sed -i 's/ro.build.version.sdk=36/ro.build.version.sdk=37/g' "$ANDROID_HOME/platforms/android-37/source.properties"
              sed -i 's/ro.build.version.codename=36/ro.build.version.codename=37/g' "$ANDROID_HOME/platforms/android-37/source.properties"
              sed -i 's/ro.build.version.release=36/ro.build.version.release=37/g' "$ANDROID_HOME/platforms/android-37/source.properties"
              sed -i 's/AndroidVersion.ApiLevel=36/AndroidVersion.ApiLevel=37/g' "$ANDROID_HOME/platforms/android-37/source.properties"
              sed -i 's/Platform 36/Platform 37/g' "$ANDROID_HOME/platforms/android-37/source.properties"
            fi
          fi
          echo "Installed Android SDK Platforms:"
          ls -la "$ANDROID_HOME/platforms"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        working-directory: pharmacode_app
        run: flutter doctor -v

      - name: Get Flutter Dependencies
        working-directory: pharmacode_app
        run: flutter pub get

      - name: Run Code Analysis & Unit Tests
        working-directory: pharmacode_app
        run: |
          flutter analyze
          flutter test test/ai_pipeline_test.dart

      - name: Build Android Release APK
        working-directory: pharmacode_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Android Release AAB (Play Store)
        working-directory: pharmacode_app
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Output Error to Summary
        if: failure()
        run: |
          echo "## Build Failure" >> $GITHUB_STEP_SUMMARY
          echo "Flutter build failed. Check the detailed step logs above." >> $GITHUB_STEP_SUMMARY

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-assets
          find pharmacode_app/build/app/outputs -name "*.apk" -o -name "*.aab" -o -name "mapping.txt"
          find pharmacode_app/build/app/outputs -name "app-release.apk" -exec cp {} release-assets/PharmaCode-Universal.apk \; 2>/dev/null || true
          find pharmacode_app/build/app/outputs -name "app-release.aab" -exec cp {} release-assets/PharmaCode-Release.aab \; 2>/dev/null || true
          find pharmacode_app/build/app/outputs -name "mapping.txt" -exec cp {} release-assets/mapping.txt \; 2>/dev/null || true
          ls -la release-assets/

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Release-Universal-APK
          path: release-assets/PharmaCode-Universal.apk
          if-no-files-found: error

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Release-AAB
          path: release-assets/PharmaCode-Release.aab
          if-no-files-found: error

      - name: Upload Deobfuscation Mapping File
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-mapping-txt
          path: release-assets/mapping.txt
          if-no-files-found: ignore

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.9
          name: "PharmaCode v1.0.9 (Build 10) Production Release"
          body: |
            ## PharmaCode v1.0.9 Release (Build 10)
            Official production signed release artifacts for **PharmaCode — B.Pharm NEP 2020 Companion with PharmaHelper AI Tutor**.

            ### What's New in v1.0.9:
            - **Firebase Direct Push Notifications**: Full support for direct push notifications sent from Firebase Console (FCM), arriving in system status bar even when the app is completely closed/killed.
            - **Broadcast Topic Subscriptions & FCM Token Copy**: Auto-subscribed to `all_students`, `all`, `updates`, `general`, and `announcements` topics. Device FCM Token copy button added to Notification Center for instant test pushes.
            - **Full-Screen AI Note Reader Screen**: Dedicated reader screen (`AiNoteDetailScreen`) for saved bookmarks with dynamic font resizing (`A-` / `A+`), full-width layout, copy, share, and ask follow-up.
            - **Responsive Table Layouts in Markdown**: Tables with up to 3 columns auto-fit comfortably to screen width (`FlexColumnWidth`), compact cell padding, and 4+ column tables feature a clear swipe indicator.
            - **Hardened ProGuard / R8 Rules**: Explicit keep rules for `io.flutter.plugins.firebase.messaging.**` preventing background service pruning.
            - **Production Signed**: Release APK and Play Store AAB built with production keystore.

            ### Available Downloads:
            - **Google Play App Bundle**: `PharmaCode-Release.aab` (Signed with production release keystore for Play Console)
            - **Universal APK**: `PharmaCode-Universal.apk` (Install directly on any Android device)
            - **Deobfuscation File**: `mapping.txt` (Upload to Google Play Console for crash deobfuscation)
          files: |
            release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
