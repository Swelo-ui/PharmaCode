name: Build & Release PharmaCode Android APK & AAB

on:
  push:
    branches: [ main, master ]
    paths:
      - 'pharmacode_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Platform & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          # Pre-cache Android 37 platform if available
          echo "Ensuring platform 37 availability..."
          curl -sL "https://dl.google.com/android/repository/platform-37.0_r02.zip" -o /tmp/platform-37.zip 2>/dev/null || true
          if [ -s /tmp/platform-37.zip ]; then
            mkdir -p /tmp/p37 && unzip -qo /tmp/platform-37.zip -d /tmp/p37 2>/dev/null || true
            mkdir -p "$ANDROID_HOME/platforms/android-37" "$ANDROID_HOME/platforms/android-37.0"
            cp -r /tmp/p37/*/* "$ANDROID_HOME/platforms/android-37/" 2>/dev/null || true
            cp -r /tmp/p37/*/* "$ANDROID_HOME/platforms/android-37.0/" 2>/dev/null || true
          fi
          echo "Installed Android SDK Platforms:"
          ls -la "$ANDROID_HOME/platforms"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        working-directory: pharmacode_app
        run: flutter doctor -v

      - name: Get Flutter Dependencies
        working-directory: pharmacode_app
        run: flutter pub get

      - name: Run Code Analysis & Unit Tests
        working-directory: pharmacode_app
        run: |
          flutter analyze
          flutter test test/ai_pipeline_test.dart

      - name: Build Android Release APK
        working-directory: pharmacode_app
        run: flutter build apk --release

      - name: Build Android Release AAB (Play Store)
        working-directory: pharmacode_app
        run: flutter build appbundle --release

      - name: Output Error to Summary
        if: failure()
        run: |
          echo "## Build Failure" >> $GITHUB_STEP_SUMMARY
          echo "Flutter build failed. Check the detailed step logs above." >> $GITHUB_STEP_SUMMARY

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-assets
          find pharmacode_app/build/app/outputs -name "*.apk" -o -name "*.aab" -o -name "mapping.txt"
          find pharmacode_app/build/app/outputs -name "app-release.apk" -exec cp {} release-assets/PharmaCode-Universal.apk \; 2>/dev/null || true
          find pharmacode_app/build/app/outputs -name "app-release.aab" -exec cp {} release-assets/PharmaCode-Release.aab \; 2>/dev/null || true
          find pharmacode_app/build/app/outputs -name "mapping.txt" -exec cp {} release-assets/mapping.txt \; 2>/dev/null || true
          ls -la release-assets/

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Release-Universal-APK
          path: release-assets/PharmaCode-Universal.apk
          if-no-files-found: error

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Release-AAB
          path: release-assets/PharmaCode-Release.aab
          if-no-files-found: error

      - name: Upload Deobfuscation Mapping File
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-mapping-txt
          path: release-assets/mapping.txt
          if-no-files-found: ignore

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.7
          name: "PharmaCode v1.0.7 (Build 8) Production Release"
          body: |
            ## PharmaCode v1.0.7 Release (Build 8)
            Official production signed release artifacts for **PharmaCode — B.Pharm NEP 2020 Companion with PharmaHelper AI Tutor**.

            ### What's New in v1.0.7:
            - **Google Play R8 Code Optimization**: Enabled full R8 code shrinking, dead code removal, and resource shrinking (`isMinifyEnabled = true`, `isShrinkResources = true`).
            - **Google Play Target SDK 36**: Built on target API level 36 (Android 16) complying with Google Play requirements.
            - **Obfuscation & Security**: Included ProGuard/R8 deobfuscation mappings, hardened against decompilation.
            - **Bookmark Cloud Sync**: AI Tutor response bookmarks now persist to Firebase user account across devices.
            - **Code & Table Formatting**: Terminal-styled code blocks and clean tables in AI responses without `<br>` artifacts.
            - **AdMob Integration**: Non-intrusive banner and interstitial ads with smart frequency capping.

            ### Available Downloads:
            - **Google Play App Bundle**: `PharmaCode-Release.aab` (Signed with production release keystore for Play Console)
            - **Universal APK**: `PharmaCode-Universal.apk` (Install directly on any Android device)
            - **Deobfuscation File**: `mapping.txt` (Upload to Google Play Console for crash deobfuscation)
          files: |
            release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
