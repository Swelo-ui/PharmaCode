name: Build & Release PharmaCode Android APK & AAB

on:
  push:
    branches: [ main, master ]
    paths:
      - 'pharmacode_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Platform & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # ✅ Fixed: compileSdk is now 36 (real SDK). No more fake SDK-37 copy hack.
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          echo "Installed Android SDK Platforms:"
          ls -la "$ANDROID_HOME/platforms"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        working-directory: pharmacode_app
        run: flutter doctor -v

      - name: Get Flutter Dependencies
        working-directory: pharmacode_app
        run: flutter pub get

      - name: Run Code Analysis & Unit Tests
        working-directory: pharmacode_app
        run: |
          flutter analyze --no-fatal-infos
          flutter test test/ai_pipeline_test.dart

      - name: Configure Production Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p pharmacode_app/android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > pharmacode_app/android/upload-keystore.jks
          else
            echo "" | base64 -d > pharmacode_app/android/upload-keystore.jks
          fi

          STORE_PWD="${STORE_PASSWORD:-pharmacode2026}"
          KEY_PWD="${KEY_PASSWORD:-pharmacode2026}"
          KEY_AL="${KEY_ALIAS:-pharmacode}"

          cat <<EOF > pharmacode_app/android/key.properties
          storePassword=$STORE_PWD
          keyPassword=$KEY_PWD
          keyAlias=$KEY_AL
          storeFile=../upload-keystore.jks
          EOF

      - name: Build Android Release APK
        working-directory: pharmacode_app
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation

      - name: Build Android Release AAB (Play Store)
        working-directory: pharmacode_app
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation

      - name: Output Error to Summary
        if: failure()
        run: |
          echo "## Build Failure" >> $GITHUB_STEP_SUMMARY
          echo "Flutter build failed. Check the detailed step logs above." >> $GITHUB_STEP_SUMMARY

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-assets
          find pharmacode_app/build/app/outputs -name "*.apk" -o -name "*.aab" -o -name "mapping.txt"
          find pharmacode_app/build/app/outputs -name "app-release.apk" -exec cp {} release-assets/PharmaCode-Universal.apk \; 2>/dev/null || true
          find pharmacode_app/build/app/outputs -name "app-release.aab" -exec cp {} release-assets/PharmaCode-Release.aab \; 2>/dev/null || true
          find pharmacode_app/build/app/outputs -name "mapping.txt" -exec cp {} release-assets/mapping.txt \; 2>/dev/null || true
          ls -la release-assets/

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Release-Universal-APK
          path: release-assets/PharmaCode-Universal.apk
          if-no-files-found: error

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Release-AAB
          path: release-assets/PharmaCode-Release.aab
          if-no-files-found: error

      - name: Upload Deobfuscation Mapping File
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-mapping-txt
          path: release-assets/mapping.txt
          if-no-files-found: ignore

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.16
          name: "PharmaCode v1.0.16 (Build 18) — Critical Crash Fix Release"
          body: |
            ## PharmaCode v1.0.16 Release (Build 18)
            Official production signed release artifacts for **PharmaCode — B.Pharm NEP 2020 Companion with PharmaHelper AI Tutor**.

            ### 🔴 Critical Crash Fixes (APK Instant Close — Root Causes):
            - **MainActivity Resources$NotFoundException Crash [PLAY CONSOLE #1 CRASH FIX]**: Removed broken `<bitmap android:src="@mipmap/ic_launcher" />` from `launch_background.xml`. On Android 8.0+ (API 26+), `ic_launcher` is an `<adaptive-icon>` XML which caused `BitmapDrawable` to crash with `Resources$NotFoundException` on 100% of devices during `MainActivity.onCreate`.
            - **R8 Resource Shrinker Protection**: Added `res/raw/keep.xml` to prevent R8 resource shrinker from stripping launcher icons, notification icons, or audio assets.
            - **Firebase Init Crash**: Initialized `Firebase.initializeApp()` in `main()` before `runApp()` to eliminate cold-start race conditions.
            - **R8 ProGuard Rules**: Added comprehensive `-keep` rules for Firebase, Google Play Services, AdMob, Google Sign-In, and SecureStorage.
            - **Android 15 Edge-to-Edge**: Full support for Android 15 edge-to-edge layout without deprecated window color APIs.

            ### Security & Hardening:
            - **Signing Credentials Protection**: Keystore and `key.properties` removed from version control with `.gitignore` coverage.
            - **Secure Storage**: Hardware-backed `FlutterSecureStorage` with `encryptedSharedPreferences` enabled.
            - **Android App Hardening**: `android:allowBackup="false"`.

            ### Play Store Optimizations:
            - Target SDK 36 (Android 16), Compile SDK 36 (real).
            - R8 bytecode minification with fixed ProGuard rules preventing class stripping.
            - Faster local builds: Gradle daemon & parallel builds re-enabled.
          files: |
            release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

