# Gradle JVM allocation for R8 code shrinking and optimization
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true

kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.enableR8.fullMode=true
android.newDsl=false
android.builtInKotlin=false
# ✅ Removed android-37 suppression — compileSdk is now correctly set to 36
android.dependencyResolutionCheck=false
