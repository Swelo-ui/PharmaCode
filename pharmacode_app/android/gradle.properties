# Gradle JVM allocation for R8 code shrinking and optimization
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
android.suppressUnsupportedCompileSdk=37.0,37
android.dependencyResolutionCheck=false

