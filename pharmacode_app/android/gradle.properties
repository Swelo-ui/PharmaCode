# Gradle JVM allocation for R8 code shrinking and optimization
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# ✅ daemon=true speeds up local builds (was false causing slow local compilation)
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.enableR8.fullMode=true
android.newDsl=false
android.builtInKotlin=false
# ✅ Removed android-37 suppression — compileSdk is now correctly set to 36
android.dependencyResolutionCheck=false
