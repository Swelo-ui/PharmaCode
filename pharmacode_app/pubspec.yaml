name: pharmacode_app
description: "PharmaCode — Complete B.Pharm NEP 2020 Study Companion"
publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  share_plus: 13.3.0
  flutter_local_notifications: ^22.3.0
  google_fonts: ^6.2.1
  animations: ^2.0.11
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_messaging: ^15.2.4
  google_sign_in: ^6.2.2
  flutter_riverpod: 2.6.1
  flutter_secure_storage: ^9.2.4
  shimmer: 3.0.0
  cached_network_image: 3.4.1
  google_mobile_ads: ^5.2.0
  timezone: ^0.11.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
