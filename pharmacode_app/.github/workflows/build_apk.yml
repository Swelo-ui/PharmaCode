name: Build PharmaCode Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK (Free Cloud Runner - 16GB RAM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: pharmacode_app

      - name: Build Android APK (Split per ABI for minimal size)
        run: flutter build apk --split-per-abi --release
        working-directory: pharmacode_app

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PharmaCode-Release-APKs
          path: pharmacode_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
